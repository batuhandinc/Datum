services:
  db:
    image: postgres:16-alpine
    container_name: datum-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: datum
      POSTGRES_PASSWORD: datum
      POSTGRES_DB: datum
    ports:
      - "5432:5432"
    volumes:
      - datum-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datum -d datum"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  datum-pgdata:
